/* Marca: G8b · tema B "Claro" (crema + navy + vino) */
:root{
  --bg:#F6F1E9; --card:#FFFFFF; --line:#E4DCCF; --done:#C9BFB0; --edge:#7D8697; /* --edge: borde de controles (inputs, series), 3.3:1 crema · 3.7:1 blanco */
  /* --accent: texto/bordes/enlaces (vino 6.45:1 crema · 7.25:1 blanco). --accent-fill: botones vino con texto crema 6.45:1 */
  --accent:#A3263A; --accent-fill:#A3263A; --on-accent:#F6F1E9;
  --gold:#7E5F28; --gold-fill:#7E5F28; --on-gold:#F6F1E9; /* bronce: texto de resalte 5.25:1 sobre crema; rellenos (racha, insignias) con texto crema */
  --text:#0E1A2E; --muted:#566074; --err:#B42318;
  --radius:22px; --tabh:68px; --ctah:50px;
  --fh:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--fb);font-weight:400;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--tabh) + var(--ctah) + 20px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 45% at 100% 0%,rgba(64,108,190,.08),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(163,38,58,.06),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:600}
.top{position:sticky;top:0;z-index:5;background:rgba(14,26,46,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line)}
.logo{width:40px;height:40px;border-radius:50%;background:#F6F1E9;color:#0E1A2E;display:grid;place-items:center;font-family:var(--fh);font-weight:900;font-size:15px;letter-spacing:.02em;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:100%;height:100%;display:block}
.top h1{font-family:var(--fh);font-weight:800;font-size:16px;margin:0;line-height:1.15}
.top small{display:block;color:var(--muted);font-family:var(--fh);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;text-wrap:balance}
main{max-width:560px;margin:0 auto;padding:16px 16px 0}
section{display:none}
section.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:6px 2px 8px}
.kicker::before{content:"";flex:none;width:30px;height:4px;border-radius:2px;background:var(--accent)}
h2{font-family:var(--fh);font-weight:900;font-size:30px;line-height:1.04;letter-spacing:-.025em;margin:0 2px 10px}
.hl{color:var(--accent)}
h3{font-family:var(--fh);font-weight:800;font-size:18px;line-height:1.2;letter-spacing:-.01em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 2px 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.hero{padding:22px 20px}
.hero h2{font-size:32px;margin:0 0 10px}
.hero p{margin:0;color:var(--text)}
.rule{display:flex;gap:14px;align-items:flex-start;padding:12px 0}
.rule+.rule{border-top:2px solid var(--line)}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-fill);color:var(--on-accent);font-family:var(--fh);font-weight:900;font-size:17px;display:grid;place-items:center}
.rule b{display:block;font-weight:600;font-size:16.5px}
.rule span{color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:96px;color:var(--text)}
.step svg{width:28px;height:28px;display:block;margin-bottom:8px}
.step b{display:block;font-family:var(--fh);font-weight:800;font-size:15px}
.step span{font-size:13px;color:var(--muted)}
.ico{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 16px;line-height:1.25;gap:8px;width:100%;min-height:56px;border:none;border-radius:16px;
  background:var(--accent-fill);color:var(--on-accent);font-family:var(--fh);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);text-transform:none;letter-spacing:0;font-size:15.5px}
.seg{display:flex;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:46px;border:none;border-radius:12px;background:transparent;font-family:var(--fb);font-weight:600;color:var(--muted);line-height:1.15;padding:4px 6px;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button svg{width:20px;height:20px}
.seg button.on{background:var(--line);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
.pills{display:flex;gap:8px;margin-bottom:12px}
.pills button{flex:1;min-height:48px;border-radius:999px;border:2px solid var(--edge);background:var(--card);color:var(--text);font-family:var(--fh);font-weight:800;font-size:15px}
.pills button.on{border-color:var(--accent);background:var(--accent-fill);color:var(--on-accent)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.lbl{font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ex h3{margin:0;font-size:19px}
.ex .meta{display:inline-block;margin:8px 0 12px;background:var(--bg);border:2px solid var(--line);color:var(--gold);font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.fig{display:block;width:100%;height:auto;margin:0 0 12px;border-radius:14px}
.ex ul{margin:0 0 14px;padding-left:20px}
.ex li{margin:4px 0;font-size:15px}
.ex li::marker{color:var(--accent)}
.sets{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set{width:56px;height:56px;border-radius:50%;border:2px solid var(--edge);background:var(--bg);color:var(--text);font-family:var(--fh);font-weight:800;font-size:17px;display:grid;place-items:center}
.set.done{background:var(--accent-fill);border-color:var(--accent);color:var(--on-accent)}
.set.done::after{content:"✓";font-size:22px;font-weight:900}
.set.done span{display:none}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
label.f{display:block;font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.field{margin-bottom:16px}
.inp{width:100%;min-height:54px;border:2px solid var(--edge);border-radius:14px;padding:0 14px;background:var(--bg);color:var(--text);font-size:18px;outline:none}
.inp::placeholder{color:#7F8CA6}
.inp:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unitwrap{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:start}
.unitwrap .seg{margin:0}
.unitwrap .seg button{min-height:42px}

const addv = (p, q) => [p[0] + q[0], p[1] + q[1]];
function joints(o) {

  d.hd ??= d.t; d.ua2 ??= d.ua1; d.fa2 ??= d.fa1; d.th2 ??= d.th1; d.sh2 ??= d.sh1; d.ft2 ??= d.ft1;

}

function ref(J, r) { return typeof r[1] === "string" || typeof r[2] === "string" ? null : [J[r[0]][0] + (r[1] || 0), J[r[0]][1] + (r[2] || 0)]; }

}

function illustration(ex, name) {
  const frames = ex.f.map(f => ({ J: joints(f), props: f.p || [] }));

  for (const fr of frames) for (const pt of [...Object.values(fr.J), ...propPoints(fr.J, fr.props)]) {
    minX = Math.min(minX, pt[0]); maxX = Math.max(maxX, pt[0]); minY = Math.min(minY, pt[1]);
  }
  minX -= 7; maxX += 7; minY -= 7;

  frames.forEach((fr, i) => {

async function submitLead(form) {
  const fd = new FormData(form), g = k => String(fd.get(k) || "").trim(), err = $("#leadErr");
  if (g("website")) { S.lead = { sent: true, name: "" }; save(); renderTab(); return "honeypot"; } // bot: no se envía nada
  const nombre = g("nombre"), email = g("email"), whatsapp = g("whatsapp");
  if (!nombre || (!email && !whatsapp)) { err.textContent = t("leadNeed"); err.hidden = false; return "invalid"; }
  if ((email && !form.elements.email.checkValidity()) || (whatsapp && !/^\+[1-9]\d{7,14}$/.test(whatsapp.replace(/[\s()-]/g, ""))) || !fd.get("consent")) {
    err.textContent = t("leadNeed"); err.hidden = false; err.setAttribute("role", "alert"); return "invalid";
  }
  if (fd.get("reminder") && !email) { err.textContent = bi("Añade tu email para recibir el chequeo opcional, o desmarca esa opción.", "Add your email for the optional check-in, or uncheck that option."); err.hidden = false; return "invalid"; }
  err.hidden = true;
  track("lead_attempt");
  const body = new URLSearchParams({ nombre, email, whatsapp, objetivo: g("objetivo"), idioma: S.lang, fuente: "app-plan-4-semanas", consentimiento: "contacto-solicitud", recordatorio: fd.get("reminder") ? "recordatorio-28-dias-v1" : "", consentimiento_fecha: new Date().toISOString() });
  const url = String(CONFIG.LEAD_FORM_URL || "").trim();
  S.lead = { sent: true, name: "", status: url ? "pending" : "failed" };
  save(); renderTab(); track("plan_available");
  if (!url) return "available";
  try {
    await fetch(url, { method: "POST", mode: "no-cors", body, signal: AbortSignal.timeout(12000) });
    S.lead.status = "unverified"; track("lead_unverified");
  } catch (e) { S.lead.status = "failed"; track("lead_failed"); }
  save(); if (S.tab === "inicio") renderTab();
  return "available";

}

function calculate({ sex, age, kg, cm, act, goal }) {
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (sex === "h" ? 5 : -161);   // Mifflin-St Jeor
  const tdee = bmr * act;
  let kcal = tdee, diff = 0;
  if (goal === "bajar") { diff = Math.min(tdee * 0.25, 750); kcal = Math.max(tdee - diff, sex === "h" ? 1500 : 1200); diff = tdee - kcal; }
  if (goal === "ganar") { diff = Math.min(tdee * 0.10, 300); kcal = tdee + diff; }
  const refKg = Math.min(kg, 27 * (cm / 100) ** 2);                     // peso de referencia (evita metas exageradas con mucho peso)
  const prot = refKg * ({ bajar: 2.0, mantener: 1.6, ganar: 1.8 }[goal]);
  const r10 = n => Math.round(n / 10) * 10;
  return { bmr: r10(bmr), tdee: r10(tdee), kcal: r10(kcal), diff: r10(Math.abs(diff)), prot: Math.round(prot / 5) * 5, goal };
}

function chart(P, opt = {}) {
  const w = 340, h = 190, pl = 40, pr = 14, pt = 14, pb = 28;
  if (!P.length) return `<svg class="chart" viewBox="0 0 ${w} ${h}"><rect x="0" y="0" width="${w}" height="${h}" rx="12" fill="#0E1A2E"/><text x="${w / 2}" y="${h / 2}" text-anchor="middle" font-size="13" fill="#A3AEC2" font-family="Inter,system-ui">${t("chartEmpty")}</text></svg>`;
  const ts = P.map(e => new Date(e.d + "T12:00").getTime()), vs = P.map(e => e.v);
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1) { t0 -= 864e5 * 3; t1 += 864e5 * 3; }
  let v0 = Math.min(...vs, ...(opt.band || [])), v1 = Math.max(...vs, ...(opt.band || [])); const padv = Math.max(1, (v1 - v0) * 0.12); v0 -= padv; v1 += padv;
  const X = tt => pl + (tt - t0) / (t1 - t0) * (w - pl - pr), Y = v => pt + (1 - (v - v0) / (v1 - v0)) * (h - pt - pb);
  let g = `<svg class="chart" viewBox="0 0 ${w} ${h}" font-family="Inter,system-ui,sans-serif">`;
  if (opt.band) g += `<rect x="${pl}" y="${Y(opt.band[1])}" width="${w - pl - pr}" height="${Y(opt.band[0]) - Y(opt.band[1])}" fill="rgba(255,194,75,.14)"/><text x="${w - pr - 4}" y="${Y(opt.band[1]) + 13}" text-anchor="end" font-size="10" font-weight="700" fill="#FFC24B">${t("bGoal")} ${opt.band[0]}–${opt.band[1]}</text>`;
  for (let i = 0; i <= 3; i++) { const v = v0 + (v1 - v0) * i / 3, y = Y(v); g += `<line x1="${pl}" x2="${w - pr}" y1="${y}" y2="${y}" stroke="#2A3A5A"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#A3AEC2">${Math.round(v)}</text>`; }
  const pts = P.map((e, i) => [X(ts[i]), Y(vs[i])]);
  if (pts.length > 1) g += `<path d="M${pts[0][0]},${h - pb} L${pts.map(p => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${h - pb} Z" fill="rgba(64,108,190,.22)"/><polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#0E1A2E" stroke="var(--accent)" stroke-width="2.5"/>`);
  g += `<text x="${pl}" y="${h - 8}" font-size="10" fill="#A3AEC2">${dShort(P[0].d)}</text>`;
  if (P.length > 1) g += `<text x="${w - pr}" y="${h - 8}" font-size="10" fill="#A3AEC2" text-anchor="end">${dShort(P[P.length - 1].d)}</text>`;
  return g + `</svg>`;
}

  if (!["finished","review"].includes(g("stage"))) { err.textContent=bi("Indica si terminaste o aún quieres revisar tu ciclo.", "Tell us whether you finished or still want to review your cycle."); err.hidden=false; return "invalid"; }
  const stage=g("stage")==="finished"?"finished":"review", interest=g("interest")==="paid"?"paid":"free";
  const goal=({constancia:bi("Crear constancia","Build consistency"),fuerza:bi("Ganar fuerza","Build strength"),musculo:bi("Ganar músculo","Build muscle"),grasa:bi("Bajar grasa","Lose fat")})[g("goal")] || bi("Crear constancia","Build consistency");
  const summary=cycleSummary();
  const stageText=stage==="finished"?bi("Indico que terminé mis 4 semanas","I report finishing my 4 weeks"):bi("Aún no termino; quiero revisar","Not finished yet; I want a review");
  const request=interest==="paid"?bi("Me interesa información sobre continuidad de pago; confirma disponibilidad, precio y alcance","I want information on paid continuation; please confirm availability, price and scope"):bi("Quiero orientación sobre las herramientas gratis","I want guidance on the free tools");
  const details=`Seguimiento 4 semanas | ${stageText} | ${goal} | ${request} | ${summary.days} días marcados Entrené desde ${summary.start}`;
  const message=bi("Hola Balmore, soy ","Hi Balmore, I am ")+nombre+`. ${stageText}. ${bi("Objetivo","Goal")}: ${goal}. ${summary.days} ${bi("días marcados Entrené desde","days marked Trained since")} ${summary.start}. ${request}.`;
  const wa=new URL(CONFIG.COACHING_URL);wa.searchParams.set("text",message);followupPreview={message,url:wa.href};
  const url=String(CONFIG.LEAD_FORM_URL||"").trim();
  S.followups=S.followups||{};S.followups[summary.start]={date:todayKey(),stage,interest,goal,days:summary.days,status:url?"pending":"failed",whatsappOpened:false};
  const record=S.followups[summary.start];save();track("followup_requested");renderTab();
  if(!url) return "prepared";
  const body=new URLSearchParams({nombre,email,whatsapp,objetivo:details,idioma:S.lang,fuente:"app-plan-4-semanas",tipo_solicitud:"seguimiento-4-semanas",interes:interest,estado_ciclo:stage,consentimiento:"contacto-seguimiento-resumen",consentimiento_fecha:new Date().toISOString()});
  try {await fetch(url,{method:"POST",mode:"no-cors",body,signal:AbortSignal.timeout(12000)});record.status="unverified";track("followup_unverified");} catch(e) {record.status="failed";track("followup_failed");}
  save();if(S.tab==="progreso")renderTab();return "prepared";
}
function weeklyCard() {
  const dates = Array.from({length:7},(_,i)=>todayKey(shift(new Date(),i-6)));
  const active = dates.filter(d=>Object.values(S.checks[d]||{}).some(Boolean)).length;
  const note = S.reviews[todayKey()] || "";
  const lastDate = Object.keys(S.reviews).filter(d=>d<todayKey()).sort().pop();
  return `<form class="card" id="reviewForm"><h3>${bi("Mi revisión semanal", "My weekly review")}</h3><p>${bi(`Registraste hábitos en ${active} de los últimos 7 días. El peso es solo una parte del progreso.`, `You logged habits on ${active} of the last 7 days. Weight is only one part of progress.`)}</p>
  ${lastDate ? `<p class="small"><b>${dFull(lastDate)}</b>: ${esc(S.reviews[lastDate])}</p>` : ""}<label for="reviewNote">${bi("¿Qué funcionó y qué pequeña acción repetirás esta semana?", "What worked, and what small action will you repeat this week?")}</label><textarea class="inp" id="reviewNote" name="note" maxlength="500">${esc(note)}</textarea><button class="btn" type="submit">${bi("Guardar en este navegador", "Save in this browser")}</button><p class="muted small">${bi("No se envía a Balmore. Evita información médica. Revisa energía, fuerza y constancia; no necesitas pesarte para usar la app.", "Not sent to Balmore. Avoid medical information. Review energy, strength and consistency; weighing yourself is optional.")}</p></form>`;
}
document.addEventListener("submit", e => {
  if(e.target.classList.contains("exerciseLog")) { e.preventDefault(); const f=new FormData(e.target); if(saveExerciseLog(e.target.dataset.exercise, f.get("load"), f.get("reps"))) { toast(bi("Registro guardado", "Log saved")); track("exercise_log_saved"); renderTab(); } }

  if(e.target.id === "followupForm") { e.preventDefault(); submitFollowup(e.target); }
  if(e.target.id === "startForm") { e.preventDefault(); const f=new FormData(e.target); S.mode=f.get('mode'); S.freq=f.get('freq'); S.day=0; S.onboarded=true; track('onboarding_complete'); go('rutina'); }
  if(e.target.id === "reviewForm") { e.preventDefault(); S.reviews[todayKey()]=new FormData(e.target).get('note'); save(); toast(bi('Revisión guardada','Review saved')); track('review_saved'); }
  if(e.target.id === "helpForm") { e.preventDefault(); const f=new FormData(e.target); const msg=bi('Hola Balmore, vengo de tu app fitness.','Hi Balmore, I came from your fitness app.')+` ${bi('Objetivo','Goal')}: ${f.get('goal')}. ${bi('Disponibilidad','Availability')}: ${f.get('days')}. ${bi('Busco','Looking for')}: ${f.get('support')}. `+bi('Me interesa saber cuando el acompañamiento esté disponible.','I am interested in hearing when support becomes available.');
    const url=new URL(CONFIG.COACHING_URL); url.searchParams.set('text',msg); $('#helpResult').innerHTML=`<p>${esc(msg)}</p><a class="btn" href="${esc(url.href)}" target="_blank" rel="noopener">${bi('Abrir WhatsApp','Open WhatsApp')} →</a>`; track('qualification_complete'); }
});
document.addEventListener('click', e=> {const a=e.target.closest('a'); if(a && a.href.startsWith('https://wa.me/')) { track('whatsapp_click'); if(a.hasAttribute('data-followup-whatsapp')) { const r=(S.followups||{})[cycleSummary().start]; if(r) {r.whatsappOpened=true;save();} track('followup_whatsapp_opened'); } }});

// The day-28 email opens the personal progress/review screen.
if (location.hash === "#progreso") { S.tab = "progreso"; S.proSub = "mio"; }
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
</body>
</html>
